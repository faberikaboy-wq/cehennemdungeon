  else if(e.pointerId===lid){a+=(e.clientX-lx)*.007;lx=e.clientX}});
 const up=e=>{if(e.pointerId===jid){jid=null;js=jf=0;jr=0;$('jb').style.display='none'}if(e.pointerId===lid)lid=null};
 tc.addEventListener('pointerup',up);tc.addEventListener('pointercancel',up);
 const bt=(id,dn,uf)=>{const b=$(id),u=()=>{b.classList.remove('on');uf&&uf()};b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}b.classList.add('on');dn()});b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u)};
 bt('bF',()=>fh=1,()=>fh=0);bt('bD',dash);bt('bG',glory);
 bt('bW',()=>{for(let k=1;k<5;k++){const j=(cur+k)%4;if(have[j]){cur=j;break}}});

newGame();let last=performance.now();
